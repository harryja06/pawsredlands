name: Daily Lightspeed sync

on:
  schedule:
    # Runs at 07:00 UTC every day (adjust to taste). GitHub Actions cron
    # can lag a few minutes at busy times, which is fine for a daily job.
    - cron: '0 7 * * *'
  workflow_dispatch: # lets you trigger a run manually from the Actions tab
    inputs:
      backfill_days:
        description: >
          Optional one-time backfill: pull this many days of sales history
          (e.g. 84 for 12 weeks) to seed real product trend data immediately
          instead of waiting for the daily job to accumulate it. Leave blank
          for a normal run. This makes the run much slower/heavier on the
          Lightspeed API — only fill this in when you actually want a
          backfill, not on every manual run.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Lightspeed sync
        env:
          LS_CLIENT_ID: ${{ secrets.LS_CLIENT_ID }}
          LS_CLIENT_SECRET: ${{ secrets.LS_CLIENT_SECRET }}
          LS_REFRESH_TOKEN: ${{ secrets.LS_REFRESH_TOKEN }}
          LS_ACCOUNT_ID: ${{ secrets.LS_ACCOUNT_ID }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: node scripts/sync-lightspeed.js

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/product-sales-history.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily Lightspeed data sync"

          # A slow run (e.g. a multi-week backfill) can take long enough that
          # someone else pushes to main in the meantime, which makes a plain
          # "git push" get rejected as a non-fast-forward. Rebase onto
          # whatever's new on main and retry a few times before giving up —
          # this only ever touches the two data files above, so a conflict
          # with unrelated changes elsewhere in the repo is very unlikely.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed (main moved during this run) — retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 5 attempts — main kept moving faster than this job could catch up."
          exit 1
