name: Daily Lightspeed sync

on:
  schedule:
    # Runs at 07:00 UTC every day (adjust to taste). GitHub Actions cron
    # can lag a few minutes at busy times, which is fine for a daily job.
    - cron: '0 7 * * *'
  workflow_dispatch: # lets you trigger a run manually from the Actions tab
    inputs:
      backfill_days:
        description: >
          Optional one-time backfill: pull this many days of sales history
          (e.g. 84 for 12 weeks) to seed real product trend data immediately
          instead of waiting for the daily job to accumulate it. Leave blank
          for a normal run. This makes the run much slower/heavier on the
          Lightspeed API — only fill this in when you actually want a
          backfill, not on every manual run.
        required: false
        default: ''
      historical_months:
        description: >
          Optional one-time historical pull: walk back at least this many
          months of sales to seed real Monthly totals on the Sales Overview
          page. The report shows only the most recent 12 months, but the
          standard value to request here is still 24 (2 years) — that
          extra depth is what lets EVERY one of those 12 shown months carry
          a real "vs same month last year" figure (each shown month's
          year-ago counterpart is 12-24 months back, which a 24-month-deep
          pull covers). A shallower value, e.g. 12, would leave every shown
          month without a year-over-year comparison, so 24 is recommended
          rather than optional in practice. Leave blank for
          a normal run. This walks the ENTIRE transaction history in the
          requested window record-by-record (no shortcut report endpoint
          exists) and can take a long time on a store with a lot of sales
          history — tens of minutes to over an hour depending on volume. It
          is checkpointed: if it doesn't finish in one run, re-run the
          workflow with the same value and it picks up where it left off
          instead of starting over. Only fill this in when you actually
          want to (re)seed historical totals, not on every manual run — it
          is separate from backfill_days above (which only affects
          product-level trend history, not Monthly totals).
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Lightspeed sync
        env:
          LS_CLIENT_ID: ${{ secrets.LS_CLIENT_ID }}
          LS_CLIENT_SECRET: ${{ secrets.LS_CLIENT_SECRET }}
          LS_REFRESH_TOKEN: ${{ secrets.LS_REFRESH_TOKEN }}
          LS_ACCOUNT_ID: ${{ secrets.LS_ACCOUNT_ID }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
          HISTORICAL_MONTHS: ${{ github.event.inputs.historical_months }}
        run: node scripts/sync-lightspeed.js

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/product-sales-history.json public/store-sales-history.json public/period-totals-state.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily Lightspeed data sync"

          # A slow run (e.g. a multi-week backfill) can take long enough that
          # someone else pushes to main in the meantime, which makes a plain
          # "git push" get rejected as a non-fast-forward. Rebase onto
          # whatever's new on main and retry a few times before giving up —
          # this only ever touches the data files above, so a conflict
          # with unrelated changes elsewhere in the repo is very unlikely.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed (main moved during this run) — retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 5 attempts — main kept moving faster than this job could catch up."
          exit 1
